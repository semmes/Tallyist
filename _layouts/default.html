<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Tallyist</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light dark">
<style>
:root{
  --accent:#256abf; --brand-deep:#104281;
  --bg:#ffffff; --surface:#f5f7fa; --ink:#12181f; --ink-dim:#5a6472; --rule:#e2e7ee;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent:#3987e5; --brand-deep:#86b6ef;
    --bg:#0e1116; --surface:#161b22; --ink:#e8edf3; --ink-dim:#9aa5b3; --rule:#252c36;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
header.site{border-bottom:1px solid var(--rule);margin-bottom:2.25rem;padding-bottom:1.25rem}
header.site a.brand{
  color:var(--brand-deep);text-decoration:none;font-weight:650;font-size:1.05rem;letter-spacing:-0.01em;
}
nav.site{margin-top:.6rem;display:flex;gap:1.25rem;flex-wrap:wrap}
nav.site a{color:var(--ink-dim);text-decoration:none;font-size:.94rem}
nav.site a:hover,nav.site a[aria-current]{color:var(--accent)}
h1{font-size:1.9rem;line-height:1.2;letter-spacing:-0.02em;margin:0 0 .35rem}
h2{font-size:1.25rem;letter-spacing:-0.01em;margin:2.4rem 0 .6rem;padding-top:.4rem;border-top:1px solid var(--rule)}
h2:first-of-type{border-top:0;padding-top:0}
h3{font-size:1.02rem;margin:1.6rem 0 .4rem}
p,li{color:var(--ink)}
a{color:var(--accent)}
strong{font-weight:640}
ul{padding-left:1.15rem}
li{margin:.4rem 0}
code{
  background:var(--surface);padding:.12em .38em;border-radius:5px;
  font:0.88em/1 ui-monospace,SFMono-Regular,Menlo,monospace;
}
hr{border:0;border-top:1px solid var(--rule);margin:2.5rem 0}
.updated{color:var(--ink-dim);font-size:.94rem;margin:0 0 2rem}
.lede{font-size:1.12rem;color:var(--ink)}
footer.site{margin-top:3.5rem;padding-top:1.25rem;border-top:1px solid var(--rule);color:var(--ink-dim);font-size:.9rem}
footer.site a{color:var(--ink-dim)}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <a class="brand" href="{{ site.baseurl }}/">Tallyist</a>
  <nav class="site">
    <a href="{{ site.baseurl }}/"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
    <a href="{{ site.baseurl }}/privacy/"{% if page.url contains "privacy" %} aria-current="page"{% endif %}>Privacy Policy</a>
    <a href="{{ site.baseurl }}/support/"{% if page.url contains "support" %} aria-current="page"{% endif %}>Support</a>
  </nav>
</header>
<main>
{{ content }}
</main>
<footer class="site">
  Tallyist is an independently developed iOS app.
  This site and its history are public at
  <a href="https://github.com/semmes/Tallyist">github.com/semmes/Tallyist</a>.
</footer>
</div>
</body>
</html>
